<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f6; margin: 0; padding: 30px; }
  .card { max-width: 420px; margin: 40px auto; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; }
  input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
  button { background: #6a1b9a; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .flash { margin-top: 12px; color: #a00; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Login</button>
    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <p class="flash">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <p><a href="/">Back to app</a></p>
  </div>
</body>
</html>
